[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Sharon-consultant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "rank-bm25>=0.2.2",
    "watchdog>=4.0.0",
    "duckduckgo-search>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
